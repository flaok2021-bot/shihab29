name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Download offline map data
        run: curl -L -o "www/الخريطه/iraq.pmtiles" https://github.com/shihab29/www/releases/download/v1.0-map/iraq.pmtiles

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply custom icons
        run: |
          unzip -o icons.zip -d icons_extracted
          cp -r icons_extracted/android_res/mipmap-* android/app/src/main/res/
          cp -r icons_extracted/android_res/mipmap-anydpi-v26 android/app/src/main/res/
          cp icons_extracted/android_res/values/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml

      - name: Patch AndroidManifest
        run: node scripts/patch-manifest.js

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sqoor-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
